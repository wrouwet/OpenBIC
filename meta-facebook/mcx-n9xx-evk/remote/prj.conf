# cpu1 has its own console UART wired to a different physical header
# (flexcomm2_lpuart2) than cpu0's (flexcomm4_lpuart4) - rather than
# require a second serial adapter just to observe it, cpu1 stays
# headless and communicates purely over the mailbox; all verification
# happens from cpu0's already-working console (see ../README.md).
CONFIG_STDOUT_CONSOLE=n
CONFIG_MBOX=y

# Link this image at slot1_partition (0x1010a000), NOT the flash base
# (0x10000000) where cpu0's image lives - otherwise both images link to
# the same address and clobber each other when flashed. cpu0's
# second_core_boot() (soc/nxp/mcx/mcxn/soc.c) points cpu1's reset vector
# (SYSCON->CPBOOT) at slot1_partition, so cpu1's vector table has to be
# there. The board's mcx_n9xx_evk_mcxn947_cpu1.dts already chooses
# slot1_partition (chosen { zephyr,code-partition = &slot1_partition; })
# and its cpu1 defconfig already sets this symbol; pinning it here makes
# the dual-core layout self-contained in this app rather than a silent
# dependency on the in-tree board defconfig. Yields
# CONFIG_FLASH_LOAD_OFFSET=0x10a000 -> vectors at 0x1010a000.
CONFIG_USE_DT_CODE_PARTITION=y
